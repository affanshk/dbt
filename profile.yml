# Example profiles for local development
# Copy to ~/.dbt/profiles.yml and update credentials

modular_dbt_portfolio:
  target: dev
  outputs:
    postgres:
      type: postgres
      host: localhost
      user: your_user
      password: your_password
      port: 5432
      dbname: your_db
      schema: analytics
      threads: 4
    duckdb:
      type: duckdb
      path: data/duckdb.db
      schema: main
      threads: 2
  # choose either 'postgres' or 'duckdb' as your target
  # target: postgres
