# declare example sources and tables that drive model generation

sources:
  - name: source_1
    type: postgres
    schema: raw_source_1
    tables:
      - name: customers
      - name: orders
  - name: source_2
    type: s3
    schema: raw_source_2
    tables:
      - name: events
      - name: clicks

# destinations: list of supported destinations for reference
destinations:
  - name: duckdb
  - name: postgres
  - name: databricks
  - name: redshift
