# DQ rules per model (silver)
# Keys correspond to model identifiers produced by the generator

rules:
  staging__source_1__customers:
    - test: not_null
      column: id
    - test: unique
      column: id
    - test: accepted_values
      column: status
      values: [active, inactive]
  staging__source_1__orders:
    - test: not_null
      column: id
    - test: unique
      column: id
  staging__source_2__events:
    - test: not_null
      column: event_id
  staging__source_2__clicks:
    - test: not_null
      column: click_id
