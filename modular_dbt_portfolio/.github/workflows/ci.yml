name: CI
on:
  push:
    branches:
      - scaffold/modular-dbt
  pull_request:
    branches:
      - scaffold/modular-dbt

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run structure enforcement
        run: |
          python3 scripts/ci/enforce_structure.py
      - name: Generate models (if any missing)
        run: |
          python3 scripts/generate_models.py --config config/sources_config.yml
      - name: Setup dbt profiles
        run: |
          mkdir -p ~/.dbt
          cp modular_dbt_portfolio/profiles.example.yml ~/.dbt/profiles.yml
      - name: dbt deps & compile
        run: |
          pip install dbt-core dbt-postgres dbt-duckdb
          dbt deps --project-dir modular_dbt_portfolio --profiles-dir ~/.dbt || true
          dbt compile --project-dir modular_dbt_portfolio --profiles-dir ~/.dbt
      - name: dbt test
        run: |
          dbt test --project-dir modular_dbt_portfolio --profiles-dir ~/.dbt --select tag:silver --exclude tag:disabled || true
      - name: Run Great Expectations checks (optional)
        run: |
          python3 scripts/dq/run_ge.py
